[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-calibration"
version = "0.1.0"
description = "Research code for prediction-market calibration and favorite-longshot bias"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5,<2",
    "numpy>=2.4,<3",
    "pandas>=3,<4",
    "pyarrow>=23,<24",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10,<4",
    "scipy>=1.17,<2",
    "seaborn>=0.13,<1",
]
embeddings = [
    "scikit-learn>=1.8,<2",
    "sentence-transformers>=5.5,<6",
    "torch>=2.12,<3",
]
pipeline = ["eth-abi>=5.2,<6"]
classification = ["anthropic>=0.103,<1"]
telonex = ["httpx>=0.28,<1"]
dev = [
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
